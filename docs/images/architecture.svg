<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .box { rx: 10; ry: 10; }
      .lbl { fill:#0f172a; font-size:13px; font-weight:600; }
      .sub { fill:#475569; font-size:11px; }
      .edge { stroke:#94a3b8; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edge-ok { stroke:#16a34a; stroke-width:2; fill:none; marker-end:url(#arrowg); }
      .edge-bad{ stroke:#dc2626; stroke-width:2; fill:none; marker-end:url(#arrowr); stroke-dasharray:5 4; }
      .title { fill:#f59e0b; font-size:12px; font-weight:700; letter-spacing:1px; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="32" y="38" fill="#0f172a" font-size="22" font-weight="700">⚡ AURA — Autonomous SRE architecture</text>
  <text x="32" y="60" class="sub">Detect → Diagnose → Verify (Shadow Mode) → Heal → Account</text>

  <!-- user + UI -->
  <rect x="32"  y="90" width="150" height="54" class="box" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="46" y="114" class="lbl">👨‍💻 SRE / Operator</text>
  <text x="46" y="132" class="sub">voice · REST</text>

  <rect x="220" y="90" width="170" height="54" class="box" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="234" y="114" class="lbl">🖥️ AURA Dashboard</text>
  <text x="234" y="132" class="sub">React + Vite</text>

  <rect x="430" y="90" width="190" height="54" class="box" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="444" y="114" class="lbl">⚙️ Orchestrator API</text>
  <text x="444" y="132" class="sub">Express · Helmet · OTel</text>

  <path class="edge" d="M182,117 H218"/>
  <path class="edge" d="M390,117 H428"/>

  <!-- brain box -->
  <rect x="32" y="180" width="588" height="250" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="202" class="title">THE BRAIN</text>

  <rect x="56"  y="220" width="160" height="60" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="68" y="244" class="lbl">👁️ Monitor / Pulse</text>
  <text x="68" y="262" class="sub">Z-score anomaly</text>

  <rect x="250" y="220" width="180" height="60" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="262" y="244" class="lbl">🧠 ReasoningAgent v2</text>
  <text x="262" y="262" class="sub">LangGraph · Claude 3.5</text>

  <rect x="250" y="320" width="180" height="60" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="262" y="344" class="lbl">🧪 Shadow Mode</text>
  <text x="262" y="362" class="sub">canary → verify</text>

  <rect x="462" y="320" width="140" height="60" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="474" y="344" class="lbl">⚕️ MultiCloudHealer</text>
  <text x="474" y="362" class="sub">AWS · Azure · GCP</text>

  <rect x="462" y="220" width="140" height="60" class="box" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="474" y="244" class="lbl">☁️ Cloud adapters</text>
  <text x="474" y="262" class="sub">execute action</text>

  <path class="edge" d="M216,250 H248"/>
  <path class="edge" d="M340,280 V318"/>
  <path class="edge-ok" d="M430,350 H460"/>
  <path class="edge-ok" d="M532,320 V282"/>
  <path class="edge-bad" d="M250,350 H150 V282"/>
  <text x="150" y="400" class="sub" fill="#dc2626">degraded → rollback + re-plan</text>

  <path class="edge" d="M525,144 V218"/>

  <!-- governance box -->
  <rect x="648" y="180" width="280" height="250" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="664" y="202" class="title" fill="#dc2626">SAFETY &amp; GOVERNANCE</text>

  <rect x="668" y="218" width="240" height="38" class="box" fill="#fff" stroke="#fecaca"/>
  <text x="680" y="242" class="lbl">🔒 PII Redactor</text>
  <rect x="668" y="262" width="240" height="38" class="box" fill="#fff" stroke="#fecaca"/>
  <text x="680" y="286" class="lbl">🪪 RBAC + tenant isolation</text>
  <rect x="668" y="306" width="240" height="38" class="box" fill="#fff" stroke="#fecaca"/>
  <text x="680" y="330" class="lbl">🚫 Blocked-action veto</text>
  <rect x="668" y="350" width="240" height="38" class="box" fill="#fff" stroke="#fecaca"/>
  <text x="680" y="374" class="lbl">💰 FinOps budget guardrails</text>
  <rect x="668" y="394" width="240" height="30" class="box" fill="#fff" stroke="#fecaca"/>
  <text x="680" y="414" class="lbl">📝 Audit log → RCA PDF</text>

  <path class="edge" d="M620,117 H664 V216" />

  <text x="32" y="470" class="sub">The reasoning agent proposes what to try. The deterministic safety layer is non-negotiable about what is allowed to happen.</text>
  <text x="32" y="492" class="sub">Status: AWS healing is live (real SDK); Azure/GCP adapters + real traffic shadowing are labelled simulations / roadmap.</text>
</svg>
